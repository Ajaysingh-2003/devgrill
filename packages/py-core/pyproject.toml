[project]
name = "devgrill-core"
version = "0.1.0"
description = "DevGrill domain model and infrastructure adapters shared by every Python service."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "redis==8.1.0",
    "temporalio==1.34.0",
    "structlog==26.1.0",
    "pyjwt[crypto]==2.15.1",
    "pgvector==0.5.1",
    "pyyaml>=6.0.2",
    # IANA time zones for zoneinfo (Windows ships none); streak days roll over in IST.
    "tzdata>=2025.2",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
]
sentry = ["sentry-sdk>=2.0"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devgrill"
