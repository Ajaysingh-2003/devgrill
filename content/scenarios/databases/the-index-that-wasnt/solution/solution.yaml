schema: devgrill/solution@1
summary: >-
  The migration dropped the old reviews index, then its concurrent build of the covering
  replacement waited on a long report and the runner's watchdog cancelled it, leaving the new
  index INVALID.
  Every uncached product page scanned all 300k reviews. Rebuild it without blocking writes.
steps:
  - run: psql -v ON_ERROR_STOP=1 -c "REINDEX INDEX CONCURRENTLY reviews_product_id_rating_idx"
    service: tools
