schema: devgrill/solution@1
summary: >-
  The migration's ALTER TABLE took an ACCESS EXCLUSIVE lock on orders and the migrator hung
  before committing. End the blocking session so checkouts proceed, then bound lock waits in
  the API (DB_LOCK_TIMEOUT_MS) so the next stuck lock fails checkout fast instead of draining
  every pooled connection.
steps:
  - run: >-
      psql postgresql://shopkart:shopkart@postgres:5432/shopkart -v ON_ERROR_STOP=1 -c
      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
      WHERE pid IN (SELECT unnest(pg_blocking_pids(pid)) FROM pg_stat_activity)"
    service: tools
  - patch: guard.diff
    service: api
    message: "config: give up on a lock after a second instead of waiting forever"
