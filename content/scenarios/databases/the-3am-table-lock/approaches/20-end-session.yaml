schema: devgrill/approach@1
key: end-session
name: End the stuck session
outcome: partial
idea: >-
  Terminate the migrator's session: the lock goes away and checkout recovers. Nothing stops
  the next stuck lock from draining every connection again.
steps:
  - run: >-
      psql postgresql://shopkart:shopkart@postgres:5432/shopkart -v ON_ERROR_STOP=1 -c
      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
      WHERE pid IN (SELECT unnest(pg_blocking_pids(pid)) FROM pg_stat_activity)"
    service: tools
pros:
  - Fast, and touches only the session at fault
cons:
  - "The next hung migration takes the whole site down again"
fails_probes: [lock-guard]
