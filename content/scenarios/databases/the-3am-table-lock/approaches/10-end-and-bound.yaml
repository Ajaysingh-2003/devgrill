schema: devgrill/approach@1
key: end-and-bound
name: End the stuck session, then bound lock waits
outcome: full
idea: >-
  Find the session holding the lock (pg_blocking_pids) and end it: the migration rolls back
  and checkouts go through. Then set DB_LOCK_TIMEOUT_MS so a query gives up on a lock after a
  second: the next stuck migration costs checkout a few fast failures, not every connection.
steps:
  - run: >-
      psql postgresql://shopkart:shopkart@postgres:5432/shopkart -v ON_ERROR_STOP=1 -c
      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
      WHERE pid IN (SELECT unnest(pg_blocking_pids(pid)) FROM pg_stat_activity)"
    service: tools
  - patch: lock-timeout.diff
    service: api
    message: "config: give up on a lock after a second instead of waiting forever"
pros:
  - Ends the outage with the smallest blast radius (one session)
  - The next stuck lock is contained to checkout
cons:
  - The migration rolled back and has to run again, carefully
match:
  diff: '^\+DB_LOCK_TIMEOUT_MS=[1-9]'
