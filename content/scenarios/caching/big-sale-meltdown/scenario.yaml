# Spec v1 (ADR 012). The flagship: a deploy two minutes before the sale quietly turns the cache
# off (read and write keys disagree), and sale traffic lands on Postgres.
schema: devgrill/scenario@1
slug: big-sale-meltdown
title: The Big Sale Meltdown
track: caching
topic: stampedes
difficulty: sev2
est_minutes: 25
status: published
access: pro
summary: Product pages die the minute a sale starts
tags:
  - redis
  - postgres
  - deploys
base_app: shopkart
briefing:
  story: You are on call for ShopKart. At 8 p.m. the biggest sale of the year goes live. You have just
    finished dinner when your phone buzzes.
  system:
    - kind: lb
      name: load-gen
      note: sale traffic
      role: path
    - kind: api
      name: product-api
      note: Python, 4 workers
      role: path
    - kind: cache
      name: redis
      note: product cache
      role: path
    - kind: db
      name: postgres
      note: products, inventory
      role: path
    - kind: worker
      name: worker
      note: orders queue
      role: side
  goals:
    - title: Stop the bleeding
      detail: Product pages back under 500 ms p99 and under 1% errors while the sale runs.
    - title: Find what changed
      detail: Something shipped shortly before the sale. Prove whether it is the cause.
    - title: Make it hold
      detail: The fix has to survive a cold cache and keep prices fresh after updates.

page:
  severity: SEV2
  title: "product-api: p99 > 1.5s on product pages (sale traffic)"

faults:
  - use: cache/key-format-change
    at: T-2m

load:
  script: shop.js
  vus: 40
  params: { HOT_KEYS: "1042,1043,2210,77,9001" }

deploy_history:
  - message: "catalogue: sale banners and badges"
    minutes_before: 1440
  - message: "product page: lazy-load images"
    minutes_before: 180
  - message: "refactor: add version prefix to cache keys"
    minutes_before: 2
    from_fault: cache/key-format-change

beats:
  - persona: priya
    at: T+20s
    say: "Sale went live at 8 and product pages are crawling. Support says checkout is timing out too. What do you see?"
  - persona: arjun
    at: T+3m
    say: "Postgres CPU is pinned. Should I restart it? Or scale it up?"
  - persona: arjun
    when: "state:mitigated"
    say: "That's holding. Before we call it: will this survive the cache being flushed mid-sale, and are price updates still showing up?"
  - persona: priya
    when: "state:resolved"
    say: "Verified against a full sale replay: product pages are fast again and checkout is healthy. Thank you. Let's capture what happened in the postmortem while it's fresh."

constraints:
  no_scale_up: [postgres-db]
  cache_max_memory_mb: 256

# Latency and errors are what users feel; the hit rate is what this incident breaks. It keeps
# the page hardware-independent: on a fast machine Postgres can absorb the misses for a while,
# but the cache still does nothing until the key mismatch is fixed.
slo:
  p99_latency_ms: 500
  error_rate: 0.01
  thresholds:
    cache_hit_rate: { gt: 0.5 }
  for_s: 30

probes:
  - key: sale-replay
    kind: load
    title: Sale traffic
    how: Replays the sale for 45 seconds; p99 under 500 ms and under 1% errors.
    target:
      p99_ms: { lt: 500 }
      error_rate: { lt: 0.01 }
  - key: cache-serves-reads
    kind: load
    title: Cache does its job
    how: During the replay most requests never reach Postgres (from the database's own statistics).
    target:
      db_scans_per_request: { lt: 1.0 }
  - key: honest-metrics
    kind: load
    title: Metrics tell the truth
    how: During the replay, the API's own request and error counts match what the verifier measured.
    target:
      request_count_drift: { lt: 0.1 }
      error_rate_drift: { lt: 0.02 }
  - key: correctness
    kind: hidden_test
    title: Still correct
    how: Real product data, 404s for unknown products, search, orders and price changes all work.
    script: base/correctness.py
  - key: cold-cache
    kind: chaos
    title: Cold cache mid-sale
    how: Flushes the cache during sale traffic; the SLO recovers within 30 seconds.
    steps:
      - flush_cache: true
    target:
      recovery_s: { lt: 30 }
  - key: price-freshness
    kind: invariant
    title: Prices stay fresh
    how: Changes a hot product's price; the product page shows it within 5 seconds.
    script: freshness.py
    target:
      visible_after_s: { lt: 5 }
  - key: budget
    kind: budget
    title: Within budget
    how: No bigger database, no bigger cache.
    weight: 0.5

hints:
  tier1: "Postgres is the one suffering, but is it the cause? Look at what the cache is doing for product reads."
  tier2: "The cache hit rate went to zero right after a deploy. Compare the key the app reads with the key it writes."
  tier3: "The refactor made get() and invalidate() use versioned_key(), but set() still writes key(). Write with versioned_key() too (or roll the deploy back), then deploy."

rubric:
  - key: impact
    max: 2
    description: Quantifies the impact (latency, errors, duration, during the sale).
    anchors:
      "0": "No impact, or impact without any numbers."
      "1": "Some numbers (latency or errors) but not how long or who was affected."
      "2": "p99 and error rate on product pages, the duration, and that it hit sale traffic."
  - key: timeline
    max: 2
    description: Ties the start to the deploy two minutes before the sale.
    anchors:
      "0": "No timeline, or the wrong trigger (traffic alone)."
      "1": "Mentions a recent deploy without tying it to when the cache went quiet."
      "2": "The key refactor shipped two minutes before the sale; the hit rate dropped right after it."
  - key: root-cause
    max: 3
    description: Explains the read/write key mismatch and why it showed up only under sale load.
    anchors:
      "0": "Wrong cause (Postgres, Redis, traffic) or none."
      "1": "Says the cache stopped working, without the mechanism."
      "2": "The read and write keys differ, so nothing written is read back; no word on why it hurt now."
      "3": "get() reads the versioned key, set() writes the old one, so every read misses; sale traffic turned the misses into Postgres overload."
  - key: prevention
    max: 3
    description: Proposes a guard, e.g. a test that a set() is readable by get(), a hit-rate alert, canary deploys before peaks.
    anchors:
      "0": "No action items, or only 'be more careful'."
      "1": "One vague action."
      "3": "Concrete guards: a set-then-get test, a hit-rate alert, a deploy freeze or canary before peaks."

ttl_minutes: 45
par_minutes: 8

replay:
  - when: postgres-db.restarted
    mark: lost
    note: Postgres was the victim, not the cause; a restart only cleared its connections.
  - when: db.query
    match: "pg_stat_statements"
    mark: clue
    note: The same product query, thousands of times, points at the cache.
  - when: api.rolledback
    mark: clue
    note: Rolling back the deploy two minutes before the sale is the fastest mitigation.

ai:
  spoilers:
    - "versioned_key"
    - "\\bkey\\(\\)"
    - "v2:product"
    - "(read|get)s?\\b[^.]{0,40}\\b(write|set)s?\\b[^.]{0,40}\\b(different|mismatch|another|old)"
    - "(different|mismatch(ed)?|wrong) (cache )?keys?"
    - "key (format|prefix|version)"
  root_cause: >-
    The key refactor deployed two minutes before the sale made get() and invalidate() use
    versioned_key() while set() kept writing key(). Nothing written was ever read back, so every
    product read missed the cache and went to Postgres, which sale traffic overloaded. Writing
    with the versioned key (or rolling the refactor back) fixes it.
