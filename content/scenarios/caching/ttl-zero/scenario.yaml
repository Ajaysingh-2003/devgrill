# Spec v1 (ADR 012). The tutorial candidate: one config fault, a capacity page, a one-line fix.
schema: devgrill/scenario@1
slug: ttl-zero
title: TTL zero
track: caching
topic: invalidation
difficulty: sev4
est_minutes: 10
status: published
access: free
summary: The cache works locally and does nothing in production
tags:
  - redis
  - config
base_app: shopkart
briefing:
  story: The new caching layer made every local benchmark faster. In production the database load did
    not move at all.
  system:
    - kind: api
      name: product-api
      note: Python, 4 workers
      role: path
    - kind: cache
      name: redis
      note: cache
      role: path
    - kind: db
      name: postgres
      note: products
      role: path
  goals:
    - title: Find why the cache does nothing
      detail: Product reads should mostly be served from Redis. Work out why every one goes to Postgres.
    - title: Bring the database load down
      detail: Product reads on Postgres back under 75 per second, without breaking price updates.

page:
  severity: SEV4
  title: "postgres: product reads 3x normal (capacity alert)"

faults:
  - use: cache/ttl-zero
    at: T-5m
    params: { ttl: 0 }

load:
  script: shop.js
  vus: 20
  params: { HOT_KEYS: "1042,1043,2210,77,9001" }

deploy_history:
  - message: "catalogue: add trail-running category"
    minutes_before: 2880
    service: api
  - message: "product page: show stock badge"
    minutes_before: 300
    service: api
  - message: "ops: tune cache TTL for the new catalogue"
    minutes_before: 5
    from_fault: cache/ttl-zero

beats:
  - persona: priya
    at: T+15s
    say: "DB team pinged: product reads on Postgres jumped this afternoon. Latency is fine for now, but we're burning the headroom we need for the sale. Can you check the cache?"
  - persona: arjun
    when: "state:mitigated"
    say: "Postgres is back to its usual load. Nice. Make sure whatever changed can't sneak back in, then verify."
  - persona: priya
    when: "state:resolved"
    say: "Verify passed and Postgres has its headroom back for the sale. Great work. I'll let the DB team know; a quick postmortem would help them too."

unlocked_tools: [overview, logs, terminal, cache, code, deploys]

slo:
  thresholds:
    db_qps_product: { lt: 75 }
  error_rate: 0.01
  for_s: 30

probes:
  - key: sale-replay
    kind: load
    title: Sale traffic
    how: Replays the shop traffic for 45 seconds; p99 under 500 ms and under 1% errors.
    target:
      p99_ms: { lt: 500 }
      error_rate: { lt: 0.01 }
  - key: db-offload
    kind: load
    title: Database offload
    how: During the replay, most requests never reach Postgres (from the database's own statistics).
    target:
      db_scans_per_request: { lt: 1.0 }
  - key: honest-metrics
    kind: load
    title: Metrics tell the truth
    how: During the replay, the API's own request and error counts match what the verifier measured.
    target:
      request_count_drift: { lt: 0.1 }
      error_rate_drift: { lt: 0.02 }
  - key: correctness
    kind: hidden_test
    title: Still correct
    how: Real product data, 404s for unknown products, search, orders and price changes all work.
    script: base/correctness.py
  - key: budget
    kind: budget
    title: Within budget
    how: No extra replicas or memory; the fix has to be in the app.
    weight: 0.5

hints:
  tier1: "Compare the cache's hit rate with how it looked yesterday. Is anything being written to Redis at all?"
  tier2: "The cache only stores a product when its TTL is above zero. Where does the API get its TTL from, and did that change recently?"
  tier3: "config/app.env sets CACHE_TTL_SECONDS=0 since the last ops deploy. Set it back to a sensible value (300) and deploy."

rubric:
  - key: impact
    max: 3
    description: States the impact (database load, risk to the sale) without overstating it.
    anchors:
      "0": "No impact stated, or it invents an outage that didn't happen."
      "1": "Says the database was busier, with no numbers or consequence."
      "2": "Product reads on Postgres about three times normal, with the risk to the sale."
      "3": "Quantified load, duration, no customer-visible errors yet, and the headroom at risk."
  - key: root-cause
    max: 4
    description: Names the TTL config change as the cause and how it disabled caching.
    anchors:
      "0": "Wrong cause (Postgres, Redis down, traffic) or none."
      "2": "Names the TTL change but not why a TTL of 0 means nothing is cached."
      "4": "The ops deploy set CACHE_TTL_SECONDS=0, which the app treats as don't cache, so every read went to Postgres."
  - key: prevention
    max: 3
    description: Proposes a guard, e.g. config validation that rejects TTL 0 or an alert on hit rate.
    anchors:
      "0": "No action items, or only 'be more careful'."
      "1": "One vague action without an owner or a mechanism."
      "3": "Concrete guards that would have caught it: config validation or tests, a hit-rate alert, review of ops config changes."

ttl_minutes: 30
par_minutes: 5

replay:
  - when: db.query
    match: "pg_stat_statements|products"
    mark: clue
    note: Asking Postgres who is reading products shows every product page going to the database.
  - when: postgres-db.restarted
    mark: lost
    note: Restarting Postgres doesn't change who is reading from it.
  - when: redis-db.restarted
    mark: lost
    note: The cache was healthy; nothing was being written to it.

ai:
  spoilers:
    - "CACHE_TTL_SECONDS"
    - "\\bTTL\\b[^.]{0,40}\\b(0|zero)\\b"
    - "\\b(0|zero)\\b[^.]{0,20}\\bTTL\\b"
    - "disables? (the )?cach"
    - "\\bTTL\\b[^.]{0,30}\\b(setting|config|value|variable|env)"
    - "(setting|config|value|variable)[^.]{0,20}\\bTTL\\b"
  root_cause: >-
    An ops config deploy set CACHE_TTL_SECONDS=0. The product API treats a TTL of 0 as "don't
    cache", so every product read went to Postgres and its load tripled. Restoring a positive
    TTL (or rolling the deploy back) fixes it.
