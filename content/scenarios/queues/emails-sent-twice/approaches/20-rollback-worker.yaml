schema: devgrill/approach@1
key: rollback-worker
name: Roll the worker back
outcome: partial
idea: >-
  Deploy the worker commit before "fail fast on slow payment calls": a 10-second timeout, so a
  one-second charge finishes before the worker gives up. Any answer that never arrives (a
  dropped connection, a charge slower than ten seconds) is still retried as a new charge.
steps:
  - rollback_to: "worker: log order ids on retries"
    service: worker
pros:
  - One step, and today's duplicates stop
cons:
  - "Retries still aren't safe: a lost answer charges the customer twice"
fails_probes: [lost-answers]
match:
  rollback: true
