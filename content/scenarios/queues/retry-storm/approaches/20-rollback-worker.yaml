schema: devgrill/approach@1
key: rollback-worker
name: Roll the worker back
outcome: full
idea: >-
  Deploy the worker commit before "8 consumers, retry payment errors at once": one consumer
  with a 0.2 s pause after each provider error. A few calls a second stay well under the limit.
steps:
  - rollback_to: "worker: log order ids on retries"
    service: worker
pros:
  - One step back to a config that survived outages before
cons:
  - "One consumer again: the sale's extra capacity is gone"
  - A fixed pause, no jitter, is still fragile with many consumers
match:
  rollback: true
