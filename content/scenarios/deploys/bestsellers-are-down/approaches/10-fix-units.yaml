schema: devgrill/approach@1
key: fix-units
name: Set the timeout in milliseconds
outcome: full
idea: >-
  Set DB_STATEMENT_TIMEOUT_MS=2000, the two seconds that were meant, and deploy. Every real
  query finishes, and a runaway one is still cancelled.
steps:
  - patch: units.diff
    service: api
    message: "config: statement timeout is in milliseconds: 2000"
pros:
  - Keeps the guard the deploy wanted to add
cons:
  - None for the incident; the unit trap is still in the setting's users' heads
match:
  diff: "DB_STATEMENT_TIMEOUT_MS=[1-9][0-9]{3,}"
