schema: devgrill/fault@1
name: mem/leak-accelerated
kind: code_patch
summary: A "request cache" keeps every response forever; memory grows with traffic until the process is killed.
base_apps: [shopkart]
params: {}
apply:
  patch: patch.diff
  service: api
deploy_message: "perf: memoise product lookups per process"
# Workers that die take their in-flight requests with them, unseen by the app's own error
# metrics: the symptom is the memory itself, growing with traffic.
symptom:
  metric: api_memory_growth
  op: gt
  value: 1000000
  within_s: 60
