# ShopKart v1: the e-commerce base app (docs/PLAN.md §11.1, ADR 012). Read by the sandbox
# driver; nothing here is Docker-specific beyond image names.
schema: devgrill/base-app@1
slug: shopkart
name: ShopKart
version: 1

# Services start in dependency order and must pass their healthcheck before dependants
# start. `build` folders are built into devgrill/shopkart-<service>:<version>.
services:
  postgres-db:
    # Postgres 18 with the seed (db/init.sql) baked in at build time: no init on boot.
    build: db
    # client_connection_check_interval: a query whose client has gone (a restarted API) is
    # cancelled within a second instead of running to the end.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "max_connections=100",
        "-c",
        "client_connection_check_interval=1000",
      ]
    healthcheck: ["pg_isready", "-U", "shopkart", "-d", "shopkart", "-h", "127.0.0.1"]
    # .sql fault scripts run here with psql as this user.
    sql: { user: shopkart, database: shopkart }
    cpus: 1.0
    memory_mb: 768

  # A read replica, in another region: the same image as the primary (identical data) started
  # as a standby, streaming over postgres-repl. It is the disaster-recovery copy, so it applies
  # changes a minute late (a bad migration can be stopped before it reaches it).
  postgres-replica:
    optional: true
    image_from: postgres-db
    command:
      [
        "sh",
        "-c",
        'touch /srv/pgdata/standby.signal && (grep -q recovery_min_apply_delay /srv/pgdata/postgresql.auto.conf || echo "recovery_min_apply_delay = ''60s''" >> /srv/pgdata/postgresql.auto.conf) && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_stat_statements -c hot_standby=on -c "primary_conninfo=host=postgres-repl port=5434 user=replicator password=replicator application_name=replica"',
      ]
    healthcheck: ["pg_isready", "-U", "shopkart", "-d", "shopkart", "-h", "127.0.0.1"]
    logs: false
    depends_on: [toxiproxy]
    cpus: 0.5
    memory_mb: 512

  redis-db:
    # One Valkey for the product cache, sessions and the orders queue. volatile-lru: when it is
    # full, only keys with a TTL (cache entries, sessions) may be evicted, never the queue.
    image: valkey/valkey:9.1-alpine
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    healthcheck: ["valkey-cli", "ping"]
    cache: true
    cpus: 0.5
    memory_mb: 320

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    files:
      /config/proxies.json: toxiproxy/proxies.json
    # Inside the sandbox the datastores are reached THROUGH toxiproxy under these names.
    # postgres-dr is the "cross-region" endpoint: same database, a link faults can slow down.
    # postgres-repl carries the optional replica's WAL stream.
    aliases: [postgres, postgres-dr, postgres-repl, redis]
    toxiproxy: { admin_port: 8474 }
    healthcheck: ["/toxiproxy-cli", "-h", "127.0.0.1:8474", "list"]
    depends_on: [postgres-db, redis-db]
    cpus: 0.5
    memory_mb: 128

  # The payment provider: someone else's service (the player can call it, not change it).
  # Port 8081 is the sandbox's control panel for faults and probes.
  payment-gateway:
    build: payments
    healthcheck:
      ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
    logs: false
    metrics_port: 8080
    cpus: 0.5
    memory_mb: 128

  api:
    build: api
    # DATABASE_URL and the tunables live in config/app.env (config-as-code, deployed).
    env:
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: product-api
    # The player edits this source in tools:/workspace/api and deploys it.
    source:
      dest: /srv/app
      paths: [app, config]
      config_file: config/app.env
    port: 8000
    metrics: /metrics
    healthcheck: ["curl", "-fsS", "http://127.0.0.1:8000/readyz"]
    depends_on: [toxiproxy]
    cpus: 2.0
    memory_mb: 512

  worker:
    build: worker
    env:
      DATABASE_URL: postgresql://shopkart:shopkart@postgres:5432/shopkart
      REDIS_URL: redis://redis:6379/0
      PAYMENTS_URL: http://payment-gateway:8080
    # The player edits this source in tools:/workspace/worker and deploys it, like the API.
    source:
      dest: /srv/worker
      paths: [worker.py, config]
      config_file: config/worker.env
    metrics_port: 9100
    depends_on: [toxiproxy, payment-gateway]
    cpus: 0.5
    memory_mb: 256

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    env:
      DATA_SOURCE_NAME: postgresql://shopkart:shopkart@postgres-db:5432/shopkart?sslmode=disable
    logs: false
    metrics_port: 9187
    depends_on: [postgres-db]
    cpus: 0.25
    memory_mb: 64

  redis-exporter:
    image: oliver006/redis_exporter:v1.94.0
    env:
      REDIS_ADDR: redis://redis-db:6379
    logs: false
    metrics_port: 9121
    depends_on: [redis-db]
    cpus: 0.25
    memory_mb: 64

  tools:
    build: tools
    shell: true
    logs: false
    # `psql` and `redis-cli -h redis` just work: the app's own credentials, as on any on-call box.
    env:
      PGHOST: postgres
      PGUSER: shopkart
      PGPASSWORD: shopkart
      PGDATABASE: shopkart
    depends_on: [api]
    cpus: 1.0
    memory_mb: 512

slo:
  p99_latency_ms: 500
  error_rate: 0.01

# The traffic generator used during play (the "sale") and by the verifier.
load:
  script: load/shop.js
  target: http://api:8000

# Metrics derived from scrapes, by name. `labels` values are regular expressions; rates and
# quantiles are computed over the window between two scrapes.
metrics:
  p99_latency_ms:
    type: quantile
    job: api
    metric: http_request_duration_seconds
    q: 0.99
    labels: { route: "/products/\\{product_id\\}" }
    scale: 1000
  # Every route, not just product pages (the "also bought" box, search, checkout).
  api_p99_ms:
    type: quantile
    job: api
    metric: http_request_duration_seconds
    q: 0.99
    scale: 1000
  error_rate:
    type: ratio
    job: api
    metric: http_requests_total
    labels: { status: "5.." }
  request_rate:
    type: rate
    job: api
    metric: http_requests_total
  cache_hit_rate:
    type: ratio
    job: api
    metric: product_cache_total
    labels: { result: hit }
  # Share of orders charged a different price than the cached product page showed.
  price_mismatch_rate:
    type: ratio
    job: api
    metric: checkout_price_checks_total
    labels: { result: mismatch }
  # Builds of the sale landing page (/deals) per second, finished or cancelled: ~0 while
  # its cached copy serves everyone.
  deals_builds:
    type: rate
    job: api
    metric: deals_builds_total
  db_qps_product:
    type: rate
    job: api
    metric: db_queries_total
    labels: { query: fetch_product }
  db_pool_in_use:
    type: gauge
    job: api
    metric: db_pool_in_use
  db_connections:
    type: gauge
    job: postgres-exporter
    metric: pg_stat_activity_count
    labels: { datname: shopkart }
  orders_queue_depth:
    type: gauge
    job: worker
    metric: orders_queue_depth
  # Seconds the order the worker is charging has waited since checkout.
  orders_lag_s:
    type: gauge
    job: worker
    metric: orders_consumer_lag_seconds
  # Share of signed-in page views whose session was gone (the shopper is signed out).
  signed_out_rate:
    type: ratio
    job: api
    metric: session_checks_total
    labels: { result: missing }
  # Keys Valkey dropped per second to stay under maxmemory (measured by the exporter).
  cache_evictions:
    type: rate
    job: redis-exporter
    metric: redis_evicted_keys_total
  # Share of the provider's charges made for an order that had already been charged.
  duplicate_charge_rate:
    type: ratio
    job: payment-gateway
    metric: payments_charges_total
    labels: { repeat: "true" }
  # Charges the provider made, and calls it refused for the rate limit, per second.
  payments_charged:
    type: rate
    job: payment-gateway
    metric: payments_requests_total
    labels: { result: charged }
  payments_limited:
    type: rate
    job: payment-gateway
    metric: payments_requests_total
    labels: { result: limited }
  # Share of order pages that found no order: right after checkout, a ghost read.
  order_lookup_misses:
    type: ratio
    job: api
    metric: order_lookups_total
    labels: { result: missing }
  # Share of a core Valkey's main thread spends running commands (measured by the exporter).
  cache_cpu:
    type: rate
    job: redis-exporter
    metric: redis_cpu_user_seconds_total
  cache_memory_bytes:
    type: gauge
    job: redis-exporter
    metric: redis_memory_used_bytes
  # Reported by the API about itself: fine for charts and paging, never for verify.
  api_memory_bytes:
    type: gauge
    job: api
    metric: app_memory_bytes
  # Rows per second Postgres reads by scanning the whole reviews table (measured by the
  # exporter, not the app): ~0 while product ratings come from an index.
  reviews_seq_rows:
    type: rate
    job: postgres-exporter
    metric: pg_stat_user_tables_seq_tup_read
    labels: { relname: reviews }
  # Bytes per second of new peak memory across the API's workers: ~0 once warm, unless leaking.
  api_memory_growth:
    type: rate
    job: api
    metric: app_memory_growth_bytes_total
