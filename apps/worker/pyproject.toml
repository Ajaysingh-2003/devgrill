[project]
name = "devgrill-worker"
version = "0.1.0"
description = "DevGrill Temporal workers (sandbox lifecycle, verify, AI jobs)."
requires-python = ">=3.14,<3.15"
dependencies = ["devgrill-core"]

[project.scripts]
devgrill-worker = "devgrill_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
devgrill-core = { workspace = true }
