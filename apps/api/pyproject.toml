[project]
name = "devgrill-api"
version = "0.1.0"
description = "DevGrill HTTP API (FastAPI)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "devgrill-core",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "alembic==1.20.0",
]

[project.scripts]
devgrill-api = "devgrill_api.__main__:main"
devgrill-api-openapi = "devgrill_api.openapi_export:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
devgrill-core = { workspace = true }
