packages:
  - "apps/web"
  - "packages/ui"
  - "packages/tokens"
  - "packages/config"
  - "packages/api-client"

# Native build scripts allowed to run on install (pnpm blocks them by default).
allowBuilds:
  esbuild: true # Vite/Storybook bundler; postinstall verifies its native binary
  sharp: false
  unrs-resolver: false

# Security overrides (docs/qc/phase-0.md). js-yaml is used only by the API-client generator.
overrides:
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2"
  # Dev-only, through the shadcn CLI (advisories of 2026-10): zod memory, body-parser and undici DoS.
  zod@<4.6.6: ">=4.6.6"
  body-parser@>=2.0.0 <2.4.0: ">=2.4.0"
  undici@>=7.18.0 <7.30.1: ">=7.30.1"
  # Dev-only, through shadcn → dotenvx: Windows command injection (GHSA-3f7j-7jwc-fxfj).
  systeminformation@<5.33.16: ">=5.33.16"

# Accepted advisories (documented in docs/qc/phase-0.md; review when a patch ships):
# GHSA-vfj7-8cjw-p6xm braces stack-exhaustion DoS. Dev-only (eslint-config-next → fast-glob),
# processes our own lint globs, no patched version exists yet.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - framer-motion@14.2.0
  - lucide-react@1.56.0
  - motion-dom@14.2.0
  - motion-utils@14.1.1
  - motion@14.2.0
  - react-resizable-panels@4.14.5
  - "@storybook/addon-a11y@10.6.2"
  - "@storybook/addon-themes@10.6.2"
  - "@storybook/addon-vitest@10.6.2"
  - "@storybook/builder-vite@10.6.2"
  - "@storybook/react-dom-shim@10.6.2"
  - "@storybook/react-vite@10.6.2"
  - "@storybook/react@10.6.2"
  - storybook@10.6.2
  - "@codemirror/view@6.43.15"
