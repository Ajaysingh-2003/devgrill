name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks lists a PR's commits on pull_request runs

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DEVGRILL_ENV: test
  LOG_FORMAT: json

jobs:
  python:
    name: python · lint, types, unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - run: uv sync --all-packages --locked
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m basedpyright
      - run: uv run python -m pytest -m "not integration" --cov=devgrill --cov=devgrill_api --cov=devgrill_worker --cov=devgrill_gateway --cov-report=term-missing
      - name: content validate (formats, cross-references, patches apply)
        run: uv run python -m devgrill_content.cli validate

  python-windows:
    name: python · unit on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - run: uv sync --all-packages --locked
      - run: uv run python -m pytest -m "not integration"

  web:
    name: web · format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated tokens first: Prettier's Tailwind plugin loads globals.css, which imports them.
      - run: pnpm --filter @devgrill/tokens build
      - run: pnpm format:check
      - run: pnpm colors:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  ui:
    name: ui · tokens, component tests, storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Token build fails on any contrast miss; every story renders in Chromium with an axe audit.
      - run: pnpm test
      - run: pnpm --filter @devgrill/ui build-storybook

  codegen:
    name: codegen · OpenAPI client is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: fail on drift
        run: git diff --exit-code -- packages/api-client

  stack:
    name: stack · services, migrations, integration, contract, smoke, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: docker compose -f infra/compose/docker-compose.dev.yml up -d --wait
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      # .env from .env.example with generated local secrets (auth, HMAC, guest tokens).
      - run: uv run python scripts/setup.py --env-only
      - name: migrations round-trip (app schema) and auth schema
        run: |
          uv run python -m alembic -c apps/api/alembic.ini upgrade head
          uv run python -m alembic -c apps/api/alembic.ini downgrade base
          uv run python -m alembic -c apps/api/alembic.ini upgrade head
          uv run python -m alembic -c apps/api/alembic.ini check
          node apps/web/scripts/auth-migrate.mts
          node apps/web/scripts/auth-migrate.mts --check
          uv run python -m devgrill_content.cli seed
      # Real Postgres + Valkey: schema guarantees, seed, API, query plans on 10k scenarios,
      # and Schemathesis over every /v1 operation (each on its own throwaway database).
      - run: uv run python -m pytest -m integration
      - name: full-stack smoke
        timeout-minutes: 10
        run: |
          # Own process group, no stdin: the whole stack (api, worker, gateway, web) is stopped
          # when this step ends, pass or fail. A leftover background process would otherwise
          # keep the step open until the job times out.
          setsid uv run python scripts/dev.py > dev.log 2>&1 < /dev/null &
          STACK_PID=$!
          trap 'kill -TERM -- -"$STACK_PID" 2>/dev/null || true' EXIT
          uv run python scripts/smoke.py
      - name: dev log on failure
        if: failure()
        run: cat dev.log || true
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Production web build + API + mock GitHub on their own database (apps/web/e2e/stack.mjs):
      # sign-in, sign-out, expiry, guests, admin authz, prefs, axe on every page, keyboard flows.
      - name: e2e
        timeout-minutes: 15
        run: pnpm e2e
      - name: e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  hygiene:
    name: hygiene · line endings, secrets, audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv run --no-project python scripts/check_eol.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        run: |
          # Hashed export: lets pip-audit audit the exact lock without invoking pip.
          uv export --all-packages --no-emit-workspace --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
