name: evals

# The AI gates (ADR 016): grading agreement, persona leaks, prompt injection, classification,
# latency and cost, against the real models. They cost money (about $2 a run), so they run
# when prompts, the AI code or the eval sets change, weekly, and on demand: not on every push.
# Needs the repository secret OPENAI_API_KEY; without it the job says so and skips.
on:
  push:
    branches: [main]
    paths:
      - "packages/py-core/src/devgrill/ai/**"
      - "packages/py-core/src/devgrill/infra/llm.py"
      - "evals/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "packages/py-core/src/devgrill/ai/**"
      - "packages/py-core/src/devgrill/infra/llm.py"
      - "evals/**"
  schedule:
    - cron: "30 21 * * 0" # Monday 03:00 IST
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run (space-separated; empty runs all)"
        required: false
        default: ""

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: evals · AI gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_BUDGET_USD: "4"
    steps:
      - uses: actions/checkout@v7
      - name: key present?
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set as a repository secret: skipping the evals." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.key.outputs.present == 'true'
        with:
          version: "0.13.0"
      - if: steps.key.outputs.present == 'true'
        run: uv sync --all-packages --locked
      - if: steps.key.outputs.present == 'true'
        env:
          SUITES: ${{ inputs.suites }}
        # Unquoted on purpose: space-separated suite names become separate arguments.
        run: uv run python -m evals $SUITES
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-reports
          path: evals/reports/
          retention-days: 30
