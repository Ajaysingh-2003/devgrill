# Approach classification cases (ADR 016), from the approach diffs in content/. Known keys are
# the non-cheat approaches (the database never holds cheats), so cheats and new fixes are
# expected "unknown".
items:
  # ------------------------------------------------------------------ ttl-zero
  - id: c01
    scenario: ttl-zero
    expected: restore-ttl
    actions: "deployed api"
    diff: |
      diff --git config/app.env config/app.env
      --- config/app.env
      +++ config/app.env
      @@ -9,5 +9,5 @@ DB_POOL_MAX=10
       DB_POOL_TIMEOUT_S=5

       # Product cache lifetime in seconds. 0 disables caching.
      -CACHE_TTL_SECONDS=0
      +CACHE_TTL_SECONDS=300
       CACHE_KEY_PREFIX=
  - id: c02
    scenario: ttl-zero
    expected: restore-ttl
    actions: "deployed api"
    diff: |
      diff --git config/app.env config/app.env
      --- config/app.env
      +++ config/app.env
      @@ -8,6 +8,7 @@ DB_POOL_MAX=10
       DB_POOL_TIMEOUT_S=5

       # Product cache lifetime in seconds. 0 disables caching.
      -CACHE_TTL_SECONDS=0
      +# never ship 0 here: it turns the cache off
      +CACHE_TTL_SECONDS=600
       CACHE_KEY_PREFIX=
