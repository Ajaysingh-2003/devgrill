      @@ -48,7 +48,12 @@ def set(product_id: int, product: dict[str, Any]) -> None:
           try:
      -        client.set(key(product_id), json.dumps(product, default=str), ex=settings.CACHE_TTL_SECONDS)
      +        k = versioned_key(product_id)  # must match what get() reads
      +        client.set(
      +            k,
