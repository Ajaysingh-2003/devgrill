      ## Root cause

      The ops deploy set the cache TTL to zero, and with zero the entries are never kept, so the cache does nothing and reads go to Postgres.

      ## Action items

      - CI check rejecting TTL 0 in config/app.env.
      - Alert on cache hit rate below 50%.
