scenario: ttl-zero
# Labels drafted by Claude against the rubric anchors; the owner confirms or corrects each
# (set reviewed: true) before the grading gate counts them.
reviewed: false
items:
  - id: ttl-zero-01
    note: strong, blameless, quantified, concrete guards
    postmortem: |
      ## Summary

      An ops config deploy set the product cache TTL to 0, which our cache client treats as "don't cache". Every product read went to Postgres for about 20 minutes until we restored the TTL.

      ## Impact

      Product reads on Postgres ran at roughly three times normal (around 210/s against a usual 70/s) for about 20 minutes. Latency stayed inside the SLO and no customer saw errors, but we were burning the database headroom reserved for the evening sale.

      ## Root cause

      The deploy "ops: tune cache TTL for the new catalogue" changed CACHE_TTL_SECONDS from 300 to 0 in config/app.env. The cache's set() returns early when the TTL is 0 or less, so nothing was ever written to Redis. Every get() missed and fell through to Postgres.

      ## Action items

      - Validate config in CI: reject CACHE_TTL_SECONDS <= 0 unless an explicit flag disables caching (owner: platform).
      - Alert when the product cache hit rate drops below 50% for 5 minutes (owner: SRE).
      - Require a second reviewer for ops config changes on the day of a sale.
    human:
      scores: { impact: 3, root-cause: 4, prevention: 3 }
      blameless: true
      blame: []
  - id: ttl-zero-02
    note: strong root cause, good impact, one fewer guard
    postmortem: |
      ## Summary

      Product cache stopped caching after a config change. Fixed by setting the TTL back to 300 seconds.

      ## Impact

      Postgres product reads went to about 3x normal for roughly 25 minutes. No errors or latency breach for customers. The extra load ate into the headroom we need for the sale tonight.

      ## Root cause

      The ops deploy five minutes before the alert set CACHE_TTL_SECONDS=0. Our app reads a TTL of 0 as "caching disabled", so set() skipped every write and every product read went to the database.

      ## Action items

      Add a startup check that refuses a zero TTL for the product cache.
    human:
      scores: { impact: 3, root-cause: 4, prevention: 2 }
      blameless: true
      blame: []
  - id: ttl-zero-03
    note: excellent cause and actions, impact without duration
    postmortem: |
      ## Summary

      Caching was silently disabled by a config value. We restored it.

      ## Impact

      Postgres was serving about three times its normal product reads, which put the sale's database headroom at risk.

      ## Root cause

      CACHE_TTL_SECONDS was changed to 0 by the "tune cache TTL" ops deploy. In our cache module a TTL of 0 means "don't cache", so nothing was stored in Redis and each request queried Postgres directly. Local benchmarks never caught it because local config still had 300.

      ## Action items

      1. Config schema validation in CI that rejects a TTL of 0 for caches that must be on.
      2. Hit-rate alert on the product cache (below 50% for 5 minutes pages on-call).
      3. Ops config changes get the same review as code changes.
    human:
      scores: { impact: 2, root-cause: 4, prevention: 3 }
      blameless: true
      blame: []
