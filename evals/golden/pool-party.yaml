      ## Summary

      A cross-region database endpoint exhausted product-api's connection pool.

      ## Impact

      p99 over 2 s and 503 "database busy" errors from the 14:20 config deploy for about 20 minutes.

      ## Root cause

      Neha didn't bother to check where the new endpoint lives before shipping it. DATABASE_URL pointed at postgres-dr, ~150 ms per round trip away, so each request held its connection longer and the pool emptied at normal traffic (Little's law) while Postgres idled.

      ## Action items

      - Client-side query latency alerts.
      - Allow-list validation for DATABASE_URL in CI.

      Scaling Postgres was pointless (idle); a bigger pool still waits on the round trip.
