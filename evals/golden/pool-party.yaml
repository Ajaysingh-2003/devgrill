      ## Summary

      Requests hung because pooled connections were tied up waiting on a far-away database.

      ## Impact

      Latency was very high and there were 503s.

      ## Root cause

      The config change pointed us at the cross-region postgres-dr endpoint. Each query round trip got ~150 ms slower, so each connection was busy longer per request. Same traffic, longer hold time: the pool needs more connections than it has (Little's law). Postgres itself was idle.

      ## Action items

      - Query latency alerts from the client side.
      - Review and validation for DB endpoint changes.

      Bigger instance: pointless, the DB was at 20% CPU. DB_POOL_MAX=50: still pays the round trip, so latency stays high.
