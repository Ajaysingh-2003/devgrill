reviewed: false
items:
  - id: pool-party-01
    note: strong, Little's law, rejects both bad fixes, concrete guards
    postmortem: |
      ## Summary

      A config deploy pointed product-api at a cross-region database endpoint. Each query paid about 150 ms extra, connections were held longer, and the pool ran dry while Postgres sat idle.

      ## Impact

      From the config deploy at 14:20 until 14:41, product-api p99 was above 2 s and a share of requests failed with 503 "database busy".

      ## Root cause

      "config: use the new HA database endpoint" set DATABASE_URL to postgres-dr, a cross-region endpoint adding ~150 ms per round trip. With the same traffic, each request held its pooled connection much longer, so by Little's law the pool (10 per process) needed far more connections than it had. Requests queued for a connection and timed out, while Postgres CPU stayed near 20%.

      ## Action items

      - Alert on client-side query latency (p95 per query from the API), not just database CPU.
      - Validate DATABASE_URL in CI against the allowed in-region endpoints; endpoint changes need DB team review.

      Why not the suggested fixes: scaling Postgres buys nothing, it was idle. A bigger pool still pays the 150 ms on every query and just moves the queue into the database.
    human:
      scores: { impact: 2, root-cause: 4, rejected-fixes: 2, prevention: 2 }
      blameless: true
      blame: []
  - id: pool-party-02
    note: strong, one guard
    postmortem: |
      ## Summary

      Pool exhaustion caused by a slow cross-region database endpoint.

      ## Impact

      p99 over 2 s and 503 'database busy' errors on product-api for about 20 minutes after the config deploy.

      ## Root cause

      The config deploy switched DATABASE_URL to postgres-dr in another region. Every query took ~150 ms longer, so each request kept its connection longer; at the same arrival rate the pool emptied (Little's law) even though Postgres was mostly idle.

      ## Action items

      Alert on query latency measured from the API.

      Scaling the database would not help since it was at 20% CPU, and a bigger pool would still wait on the slow round trip.
    human:
      scores: { impact: 2, root-cause: 4, rejected-fixes: 2, prevention: 1 }
      blameless: true
