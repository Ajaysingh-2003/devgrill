  - id: big-sale-meltdown-05
    note: good, mechanism without why-now
    postmortem: |
      ## Summary

      Hi team, PFB the postmortem for the sale-time slowness. The cache keys were mismatched after the refactor deploy at 7:58 pm.

      ## Impact

      Product pages p99 ~2.6 s, error rate ~17%, from 8:00 to 8:13 pm during the sale.

      ## Root cause

      After the refactor, the code reads the cache with the versioned key but writes with the plain key. Hence nothing written is read back and all reads are misses.

      ## Action items

      - Add test for cache read/write key consistency.
      - Add alert on the hit rate.
