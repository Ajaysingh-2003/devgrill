reviewed: false
items:
  - id: big-sale-meltdown-01
    note: strong, blameless, full mechanism and timeline
    postmortem: |
      ## Summary

      A cache key refactor shipped at 19:58, two minutes before the 8 p.m. sale. Reads and writes stopped agreeing on the key, so the cache served nothing and sale traffic overloaded Postgres.

      ## Impact

      From 20:00 to 20:14, product pages ran at a p99 of about 2.8 s (SLO 500 ms) with roughly 18% errors, and checkout timed out for some users. All of it during the first 14 minutes of the sale.

      ## Root cause

      The deploy "refactor: add version prefix to cache keys" made get() and invalidate() use versioned_key() while set() still wrote key(). Every write went to a key nobody read, so every read missed and went to Postgres. At normal traffic this was survivable; sale traffic turned the misses into a pinned database.

      ## Action items

      - Unit test: a value written by set() is returned by get() (owner: catalogue team).
      - Alert when the product cache hit rate falls below 50% for 2 minutes.
      - Deploy freeze from 30 minutes before a sale, canary for anything urgent.
    human:
      scores: { impact: 2, timeline: 2, root-cause: 3, prevention: 3 }
      blameless: true
      blame: []
  - id: big-sale-meltdown-02
    note: strong, two guards
    postmortem: |
      ## Summary

      Product pages crawled at the start of the sale because the cache stopped serving reads after a key refactor.

      ## Impact

      p99 on product pages around 2.5 s and ~15% 5xx from 20:00 to about 20:12, while the sale was live. Checkout timeouts reported by support.

      ## Root cause

      The key refactor deployed two minutes before the sale; the hit rate dropped to nearly zero right after it. get() read the new versioned key, set() wrote the old one, so nothing ever hit. Under sale load all those misses landed on Postgres and pinned its CPU.

      ## Action items

      - Add a set-then-get test for the cache module.
      - Hit-rate alert on the product cache.
    human:
      scores: { impact: 2, timeline: 2, root-cause: 3, prevention: 2 }
      blameless: true
      blame: []
  - id: big-sale-meltdown-03
    note: strong cause and actions, timeline loosely tied
    postmortem: |
      ## Summary

      Cache misses on every product read during the sale; fixed by writing with the versioned key.

      ## Impact

      Product page p99 near 3 s and about 20% errors for roughly a quarter of an hour at the start of the sale.

      ## Root cause

      There was a recent refactor of cache keys. After it, get() and invalidate() used versioned_key() but set() still used key(), so writes and reads never met. Sale traffic multiplied the misses and Postgres went to 100% CPU.

      ## Action items

      1. Contract test: set() then get() returns the same product.
      2. Alert on hit rate under 50%.
      3. No deploys in the hour before a sale; canary first if one is unavoidable.
    human:
      scores: { impact: 2, timeline: 1, root-cause: 3, prevention: 3 }
      blameless: true
      blame: []
